name: Daily Signals

on:
  schedule:
    # 3:30 PM EDT (UTC-4, summer). In winter EST (UTC-5) this fires at 2:30 PM ET.
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

jobs:
  run-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify secrets are present
        run: |
          if [ -z "$EMAIL_ADDRESS" ]; then echo "WARNING: EMAIL_ADDRESS is empty"; else echo "OK: EMAIL_ADDRESS is set"; fi
          if [ -z "$EMAIL_PASSWORD" ]; then echo "WARNING: EMAIL_PASSWORD is empty"; else echo "OK: EMAIL_PASSWORD is set"; fi
          if [ -z "$PHONE_NUMBER" ];   then echo "WARNING: PHONE_NUMBER is empty";   else echo "OK: PHONE_NUMBER is set";   fi
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}

      - name: Run daily signals
        run: python run_daily_signals.py
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}

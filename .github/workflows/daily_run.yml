name: Daily Signals

on:
  schedule:
    - cron: "30 17 * * 1-5"   # 1:30 PM EDT (UTC-4); 12:30 PM EST in winter
  workflow_dispatch:

jobs:
  run-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run daily signals
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p signals
          .venv/bin/python run_daily_signals.py 2>&1 | tee signals/run_output.txt

      - name: Upload signal outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-outputs-${{ github.run_number }}
          path: |
            signals/*.csv
            signals/*.txt
            signals/*.js
          retention-days: 30
